[workspace]
resolver = "2"
members = [
    "crates/roboprotocol-proto",
    "crates/roboprotocol-core",
    "crates/roboprotocol-recording",
    "crates/robot-edge",
    "crates/operator-console",
    "tools/dev-certs",
    "tools/replay-decode",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
publish = false

[profile.release]
opt-level = 3
lto = "thin"
