[package]
name = "robot-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
roboprotocol-core = { path = "../roboprotocol-core" }
roboprotocol-proto = { path = "../roboprotocol-proto" }
roboprotocol-recording = { path = "../roboprotocol-recording" }
quiche = "0.22"
tokio = { version = "1", features = ["rt", "macros", "net", "process", "time", "io-util", "sync", "signal"] }
# Channel C sidecar (spinworks-tech/robotele#5): telemetry-out / autonomy-goal-in
# over Zenoh, bolted onto the control loop rather than inserted into it -- see
# zenoh_bridge.rs. Same major version as the eclipse-zenoh Python bindings
# BabyROS nodes use, for wire compatibility.
zenoh = "1"
flatbuffers = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
