[package]
name = "robot-edge"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
roboprotocol-core = { path = "../roboprotocol-core" }
roboprotocol-proto = { path = "../roboprotocol-proto" }
roboprotocol-recording = { path = "../roboprotocol-recording" }
quiche = "0.22"
tokio = { version = "1", features = ["rt", "macros", "net", "process", "time", "io-util", "sync", "signal"] }
flatbuffers = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
