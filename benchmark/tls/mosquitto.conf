# Part 4 encrypted table: plaintext on 1883 (unencrypted table), mTLS on 8883.
per_listener_settings false
allow_anonymous true

listener 1883

listener 8883
cafile /certs/dev-ca/ca.crt
certfile /certs/robot/robot.crt
keyfile /certs/robot/robot.key
# mutual auth, like Channel B; TLS 1.3 only, like QUIC
require_certificate true
tls_version tlsv1.3
