name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test:
    name: Build & test workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Cache flatc v1.11.0
        id: flatc-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/flatc
          key: flatc-1.11.0-${{ runner.os }}
      - name: Build flatc v1.11.0 (matches Cargo.lock's flatbuffers = 0.7 crate)
        if: steps.flatc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/google/flatbuffers.git /tmp/flatbuffers-src
          # v1.11.0's CMakeLists.txt hardcodes -Werror, which turns modern GCC's
          # stricter warnings (e.g. -Wstringop-overflow on GCC 13) into build
          # failures for this 2019-era codebase. Downgrade to non-fatal warnings.
          sed -i -E 's/-Werror=/-W/g; s/-Werror\b//g' /tmp/flatbuffers-src/CMakeLists.txt
          cmake -S /tmp/flatbuffers-src -B /tmp/flatbuffers-build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build /tmp/flatbuffers-build --target flatc -j"$(nproc)"
          sudo install -m 755 /tmp/flatbuffers-build/flatc /usr/local/bin/flatc
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (all crates and tools)
        run: cargo build --workspace --all-targets --verbose
      - name: Test
        run: cargo test --workspace --verbose

  lint:
    name: Lint (fmt + clippy, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Cache flatc v1.11.0
        id: flatc-cache
        uses: actions/cache@v4
        with:
          path: /usr/local/bin/flatc
          key: flatc-1.11.0-${{ runner.os }}
      - name: Build flatc v1.11.0 (matches Cargo.lock's flatbuffers = 0.7 crate)
        if: steps.flatc-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.11.0 https://github.com/google/flatbuffers.git /tmp/flatbuffers-src
          # v1.11.0's CMakeLists.txt hardcodes -Werror, which turns modern GCC's
          # stricter warnings (e.g. -Wstringop-overflow on GCC 13) into build
          # failures for this 2019-era codebase. Downgrade to non-fatal warnings.
          sed -i -E 's/-Werror=/-W/g; s/-Werror\b//g' /tmp/flatbuffers-src/CMakeLists.txt
          cmake -S /tmp/flatbuffers-src -B /tmp/flatbuffers-build -DCMAKE_BUILD_TYPE=Release -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build /tmp/flatbuffers-build --target flatc -j"$(nproc)"
          sudo install -m 755 /tmp/flatbuffers-build/flatc /usr/local/bin/flatc
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true
