name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Simulator tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install simulator dependencies
        run: pip install -r simulator/requirements.txt
      - name: Run pytest
        working-directory: simulator
        run: python -m pytest -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.16.5
      - name: Ruff check (simulator, benchmark, replay tooling)
        run: ruff check simulator benchmark tools/replay
